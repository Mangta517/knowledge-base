  category: 控制算法
  summary: "从目标毫度换算绝对脉冲后钳位，再用与上次下发目标的差值决定是否需要发新命令。"
  engineering_details:
    - "收到驱动故障后锁存错误、退出运动状态并发停止，后续更新在故障未重置时直接返回。"
    - "目标脉冲限在 `±TRACK_MAX_PULSES`。运动中偏差不超过中档阈值且距上次下发不足 10 ms 时延后。"
    - "差值落入 `TRACK_DEAD_ZONE_STEPS` 时跳过位置更新，运动超过空闲计时门限可转回 `TRACK_IDLE`。"
