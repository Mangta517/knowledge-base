  title: "按功能码验证 Emm_V5 回执长度、位置和驱动状态"
  category: 状态机与协议
  summary: "已知回复按预期长度和末字节收尾，再解码位置量或独立的接受、到位、故障事件。"
  engineering_details:
    - "`0x36` 位置帧固定 8 B，到正确长度且末字节为 `0x6B` 才完整，避免把有效载荷里的同值提前当帧尾。"
    - "位置按固件型号换算。Emm 用 `raw * 360000 / 65536`，X 用 `raw * 100`，加符号后通过量程校验才发布。"
    - "已知功能码的短回执分别将 `0x02`、`0x9F`、`0xE2/0xEE` 记为接受、到位和故障。"
