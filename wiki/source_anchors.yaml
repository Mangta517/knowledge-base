  title: "将有符号脉冲目标组装为 Emm_V5 位置帧"
  category: 状态机与协议
  summary: "位置指令把脉冲符号拆为方向和幅值，再按驱动定义排列 13 个字节。"
  engineering_details:
    - "帧头为设备地址和 `0xFD`，速度占 2 B，脉冲幅值占 4 B，均以高字节先发送。"
    - "方向字段由目标正负决定。负数先提升到 `int64_t` 再取反，避免在原有符号宽度内取负溢出。"
    - "跟踪调用传模式值 1 作为绝对定位。同步位为零，`0x6B` 是固定帧尾。"
